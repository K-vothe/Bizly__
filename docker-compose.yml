version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: bizly-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bizly_db
    ports:
      - "3306:3306"
    volumes:
      - ./Database/BizlyDB.sql:/docker-entrypoint-initdb.d/BizlyDB.sql
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bizly-backend
    ports:
      - "4001:4001"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASS=root
      - DB_PASSWORD=root
      - DB_NAME=bizly_db
      - DB_PORT=3306
      - PORT=4001
      - JWT_SECRET=bizly_super_secret_jwt_2024_production_ready
      - FRONTEND_URL=http://localhost:5173
      - SMTP_USER=test@example.com
      - SMTP_PASS=test
    depends_on:
      - mysql-db
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bizly-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
